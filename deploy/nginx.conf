# Nginx configuration for Nisir Bank Portal
# Place this file at: /etc/nginx/sites-available/nisir-bank-portal
# Then create symlink: sudo ln -s /etc/nginx/sites-available/nisir-bank-portal /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your domain or server IP
    server_name nisirbank.com.et www.nisirbank.com.et;
    
    # Increase max body size for file uploads
    client_max_body_size 10M;
    
    # Logging
    access_log /var/log/nginx/nisir-bank-portal-access.log;
    error_log /var/log/nginx/nisir-bank-portal-error.log;
    
    # Proxy to Next.js application
    location / {
        proxy_pass http://localhost:2022;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Cache static assets
    location /_next/static {
        proxy_pass http://localhost:2022;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, immutable";
    }
    
    # Handle favicon
    location /favicon.ico {
        proxy_pass http://localhost:2022;
        access_log off;
    }
}
